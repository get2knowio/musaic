name: Bug report
description: Something in Musaic isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you can.
        For security issues, use private reporting instead — see [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I click "Suggest fixes" on an album, ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan a library containing ...
        2. Open album ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: App version or the `git` commit you're running.
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Backend output (run with `DEBUG=true` for more), or browser console errors.
      render: shell
    validations:
      required: false

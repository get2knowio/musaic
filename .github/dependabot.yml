version: 2
updates:
  # Python backend (uv — pyproject.toml + uv.lock at repo root)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # fastapi is intentionally pinned <0.137 in pyproject.toml: 0.137.x
      # regressed include_router (routes silently dropped on include). Stop
      # Dependabot re-proposing 0.137+ every cycle; drop this once upstream
      # fixes the regression and the pin is lifted.
      - dependency-name: "fastapi"
        versions: [">=0.137"]

  # Frontend (npm — frontend/package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Desktop / Electron packaging (npm — desktop/package.json + package-lock.json).
  # Previously unwatched, which is why the fast-uri / js-yaml / brace-expansion
  # transitive alerts in the electron-builder toolchain had no update PRs.
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by ci.yml + desktop.yml (keeps action versions current).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

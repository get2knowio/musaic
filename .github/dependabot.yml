version: 2
updates:
  # Rust workspace (rust/Cargo.toml + rust/Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Uncomment if the 7-day cooldown is adopted for all ecosystems.
    # cooldown:
    #   default-days: 7

  # Frontend (npm — frontend/package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by ci.yml + release.yml. The tauri-cli and
  # cargo-about versions pinned in release.yml are not tracked here; bump
  # them by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

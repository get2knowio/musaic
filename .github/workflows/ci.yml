# Gates every push to main and every pull request. Mirrors the commands in
# CONTRIBUTING.md, so a green local run is a green CI run.
#
# Required: Rust on Linux, macOS and Windows, and the frontend. The
# `required` job at the end passes only when all of them passed; it is the one
# status to require for merging, and the run's conclusion follows it. Its name
# still reads "(linux, macos, frontend)" because a repository ruleset requires
# that exact status name; renaming it needs a ruleset edit first.
#
# Windows uses the synthetic test library generated on Linux, because the
# generator's audio differs in a few files on Windows.
#
# The Rust steps live in rust-tests.yml, which release.yml also calls before
# building installers.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  rust:
    name: required
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    uses: ./.github/workflows/rust-tests.yml
    with:
      os: ${{ matrix.os }}

  rust-windows:
    name: required (windows-latest)
    uses: ./.github/workflows/rust-tests.yml
    with:
      os: windows-latest
      library-from-linux: true

  frontend:
    name: frontend (eslint + typecheck + vitest + build)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (app)
        run: npm run typecheck
      - name: Typecheck (tests)
        run: npm run typecheck:test
      - name: Unit tests (vitest)
        run: npm test
      - name: Production build
        run: npm run build

  # The single status to require: green only when every required job above
  # is green, Windows included. The name is kept as is so the repository
  # ruleset that requires it keeps matching.
  required:
    name: ci passed (linux, macos, frontend)
    if: always()
    needs: [rust, rust-windows, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check the required jobs
        env:
          RUST: ${{ needs.rust.result }}
          FRONTEND: ${{ needs.frontend.result }}
          WINDOWS: ${{ needs.rust-windows.result }}
        run: |
          {
            echo "| job | result |"
            echo "|---|---|"
            echo "| rust (ubuntu-22.04, macos-15) — required | $RUST |"
            echo "| frontend — required | $FRONTEND |"
            echo "| rust (windows-latest) — required | $WINDOWS |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUST" != "success" ] || [ "$WINDOWS" != "success" ] || [ "$FRONTEND" != "success" ]; then
            echo "::error::a required job did not pass (rust: $RUST, windows: $WINDOWS, frontend: $FRONTEND)"
            exit 1
          fi

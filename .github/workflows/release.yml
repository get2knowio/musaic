# Builds the desktop installers on each platform's own runner and attaches
# them, with SHA256SUMS.txt, to a GitHub pre-release for the tag (a version
# with a pre-release part, such as 0.2.0-rc.1, is marked as a pre-release).
# The release is created as a DRAFT whose notes are the version's section of
# CHANGELOG.md; a person reviews it (the notes say which builds were run by
# hand) and publishes it. install.sh only sees published releases.
#
# Only platforms whose tests are required-green get an installer. The
# `tests` job runs the same Rust gate as CI (rust-tests.yml) on every runner
# the build matrix uses, for the tagged commit itself, and nothing is drafted
# or built unless all of them pass. The build job refuses a runner that the
# tests job does not cover, so adding a platform to the build matrix without
# its tests fails the release instead of shipping an untested installer.
#
# Unsigned: no signing, notarisation or updater configuration, and no secret
# is referenced. tauri.conf.json has `signingIdentity: null` and
# `createUpdaterArtifacts: false`; `--no-sign` makes that explicit.
#
# Tags: v<version>, where <version> is the workspace version in
# rust/Cargo.toml (semver spelling, e.g. v0.2.0-rc.1). The short pre-release
# spelling (v0.2.0-rc1) is accepted too.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0-rc.1 (must match the version in rust/Cargo.toml). Builds the selected ref."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  GH_REPO: ${{ github.repository }}
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  # Packaging tools, installed with `cargo install --locked` (cached).
  TAURI_CLI_VERSION: "2.12.4"
  CARGO_ABOUT_VERSION: "0.9.3"
  # The notices generator reads licence files; never decode them with a
  # Windows code page.
  PYTHONUTF8: "1"

jobs:
  # Keep this list equal to the runners in the build matrix below
  # (TESTED_RUNNERS enforces it).
  tests:
    name: tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    uses: ./.github/workflows/rust-tests.yml
    with:
      os: ${{ matrix.os }}

  draft:
    name: draft release
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the workspace version
        id: version
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version *= *"\([^"]*\)".*/\1/p' rust/Cargo.toml)"
          short="$(printf '%s' "$version" | sed -E 's/-(alpha|beta|rc)\.([0-9]+)$/-\1\2/')"
          case "$TAG" in
            "v$version"|"v$short") ;;
            *) echo "::error::tag $TAG does not match workspace version $version (expected v$version or v$short)"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=" >> "$GITHUB_OUTPUT" ;;
          esac

      # The notes are the version's section of CHANGELOG.md
      # ("## [<version>] - <date>" up to the next "## ").
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          printf '\n---\nBuilt by the release workflow from %s.\n' "$GITHUB_SHA" >> notes.md
          cat notes.md

      - name: Create the draft release (or reuse an existing draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $TAG is already published; refusing to change its assets"
              exit 1
            fi
            echo "reusing draft release $TAG"
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft ${{ steps.version.outputs.prerelease }} \
              --target "$GITHUB_SHA" --title "Musaic $TAG" --notes-file notes.md
          fi

  build:
    name: build (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          # Intel Mac: cross-compiled on the Apple Silicon runner.
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          # No Windows build: the Rust tests do not pass on Windows yet (#178),
          # and no installer is published for a platform whose tests are not
          # required-green. Restore this entry only when the Windows job is
          # required in ci.yml and green, and add windows-latest to the tests
          # job and to TESTED_RUNNERS in the same change:
          #   - name: windows-x64
          #     os: windows-latest
          #     target: x86_64-pc-windows-msvc
          #     bundles: nsis   # the MSI bundler rejects pre-release versions
          # 22.04: an older glibc for a wider AppImage reach.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    defaults:
      run:
        shell: bash
    env:
      # The runners the tests job covers. The Intel Mac build is
      # cross-compiled on macos-15 and is covered by the macOS test run.
      TESTED_RUNNERS: "ubuntu-22.04 macos-15"
    steps:
      - name: Refuse a platform without required tests
        run: |
          case " $TESTED_RUNNERS " in
            *" ${{ matrix.os }} "*) ;;
            *) echo "::error::${{ matrix.os }} is not covered by the tests job; no installer is built for it"; exit 1 ;;
          esac

      # Windows runners default to core.autocrlf=true, which would rewrite
      # goldens, manifests and scripts byte-wise. Check out files as committed.
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust/rust-toolchain.toml)"
          test -n "$channel" || { echo "::error::no channel in rust/rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal -c rustfmt -c clippy \
            -t "${{ matrix.target }}" --no-self-update
          (cd rust && rustc --version && cargo --version)

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libwayland-dev librsvg2-dev patchelf file

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "rust -> target"
          key: ${{ matrix.target }}

      - name: Install packaging tools
        working-directory: rust
        run: |
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli
          cargo tauri --version
          cargo about --version

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Third-party notices
        run: |
          (cd rust && cargo fetch --locked)
          python scripts/desktop_notices.py --target "${{ matrix.target }}"

      - name: Build and bundle (unsigned)
        working-directory: rust/crates/musaic-desktop
        env:
          CI: "true"
        run: |
          # A restored cache must not leave an older installer behind.
          rm -rf "../../target/${{ matrix.target }}/release/bundle"
          cargo tauri build --ci --no-sign --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" --config tauri.bundle.conf.json

      - name: Collect installers and checksums
        run: |
          bundle="rust/target/${{ matrix.target }}/release/bundle"
          mkdir dist
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist)" || { echo "::error::no installer found under $bundle"; exit 1; }
          # install.sh picks assets by these suffixes; fail here, not there.
          case "${{ matrix.name }}" in
            macos-arm64) want="_aarch64.dmg" ;;
            macos-x64)   want="_x64.dmg" ;;
            linux-x64)   want="_amd64.AppImage" ;;
            windows-x64) want="-setup.exe" ;;
          esac
          found=""
          for f in dist/*"$want"; do [ -e "$f" ] && found="$f"; done
          test -n "$found" || { echo "::error::no installer ending in $want"; exit 1; }
          cd dist
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          # Git Bash's sha256sum marks binary mode with '*'; drop it.
          $sum -- * | sed 's/ \*/  /' > "../SHA256SUMS-${{ matrix.name }}.txt"
          cat "../SHA256SUMS-${{ matrix.name }}.txt"

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* "SHA256SUMS-${{ matrix.name }}.txt" --clobber

  checksums:
    name: SHA256SUMS.txt
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Merge the per-platform checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern 'SHA256SUMS-*.txt' --dir sums
          sort -k2 sums/SHA256SUMS-*.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          for f in sums/SHA256SUMS-*.txt; do
            gh release delete-asset "$TAG" "$(basename "$f")" --yes
          done

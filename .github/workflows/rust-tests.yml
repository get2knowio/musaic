# The Rust gate for one platform: format, clippy and the whole test suite.
# Called by ci.yml (every push to main and every pull request) and by
# release.yml (before any installer is built), so a release is gated by
# exactly the steps CI runs. Mirrors the commands in CONTRIBUTING.md.
#
# Tests run the public test tier only. Private test data is never fetched
# here: MUSAIC_PRIVATE_TESTDATA is set to an empty value, so tests that need
# it print "skipped: private test data not available (<test>)" and pass.
name: rust-tests

on:
  workflow_call:
    inputs:
      os:
        description: "Runner label, e.g. ubuntu-22.04, macos-15, windows-latest"
        required: true
        type: string
      allowed-to-fail:
        description: >-
          Do not fail the calling run when this platform fails. The job still
          ends red, and the `outcome` output says what the tests did.
        required: false
        type: boolean
        default: false
      library-from-linux:
        description: >-
          Test with the synthetic library generated on Linux instead of on
          this runner. On Windows the generator's audio differs in a few
          files (floating-point maths in the platform's maths library), while
          the tests compare against the committed manifest and goldens.
        required: false
        type: boolean
        default: false
    outputs:
      outcome:
        description: "success or failure of fmt + clippy + tests on this platform"
        value: ${{ jobs.rust.outputs.outcome }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Test binaries without debug info: with it, the hosted Linux runner runs
  # out of disk while linking the ~150 test executables.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # The synthetic-library generator reads UTF-8 sources; Windows defaults to
  # the ANSI code page otherwise.
  PYTHONUTF8: "1"
  NODE_VERSION: "22"
  # The synthetic test library is byte-identical only with the tool versions
  # recorded in rust/testdata/synthetic-library/library.manifest.json
  # ("tool_versions"); keep these in step with it.
  SYNTH_PYTHON_VERSION: "3.13"
  SYNTH_PACKAGES: "numpy==2.5.4 soundfile==0.14.0 mutagen==1.48.1 Pillow==13.0.0"
  # Empty = no private test data, and no fallback lookup either.
  MUSAIC_PRIVATE_TESTDATA: ""

jobs:
  library:
    name: synthetic library (Linux, for ${{ inputs.os }})
    if: inputs.library-from-linux
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.SYNTH_PYTHON_VERSION }}
      - name: Generate and check the synthetic test library
        working-directory: rust
        run: |
          # shellcheck disable=SC2086 # SYNTH_PACKAGES is a list of arguments
          python -m pip install --disable-pip-version-check $SYNTH_PACKAGES
          python testdata/synthetic-library/gen_fixture_library.py
          git checkout -- testdata/synthetic-library/library.manifest.json
          python testdata/synthetic-library/verify_library.py
          # tar keeps the pinned mtimes the scanner tests depend on.
          tar -C testdata/synthetic-library -cf "$RUNNER_TEMP/synthetic-library.tar" library
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-library-${{ inputs.os }}
          path: ${{ runner.temp }}/synthetic-library.tar
          retention-days: 1
          if-no-files-found: error

  rust:
    name: rust (${{ inputs.os }})
    needs: library
    # Runs when the library job was skipped (the usual case) or passed.
    if: ${{ !cancelled() && needs.library.result != 'failure' }}
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.allowed-to-fail }}
    timeout-minutes: 90
    outputs:
      # Set even when continue-on-error turns this job's failure into a
      # passing run: a caller can still see (and report) what happened.
      outcome: ${{ steps.result.outputs.outcome }}
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners default to core.autocrlf=true, which would rewrite
      # goldens, manifests and scripts byte-wise. Check out files as committed.
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7

      # Exact toolchain from rust/rust-toolchain.toml. GitHub's runners ship
      # rustup; installing explicitly (rather than relying on rustup's
      # auto-install) works the same on every rustup version.
      - name: Install Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust/rust-toolchain.toml)"
          test -n "$channel" || { echo "::error::no channel in rust/rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal -c rustfmt -c clippy --no-self-update
          (cd rust && rustc --version && cargo --version)

      # WebKitGTK 4.1 + GTK 3 (Tauri, wry), libsoup 3, and the rest of what
      # the desktop crate links against on Linux.
      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libwayland-dev librsvg2-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "rust -> target"

      # The desktop crate's build script copies frontend/dist into the build,
      # so the UI must be built before cargo touches the workspace.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.SYNTH_PYTHON_VERSION }}
      - name: Generate the synthetic test library
        if: ${{ !inputs.library-from-linux }}
        working-directory: rust
        run: |
          # shellcheck disable=SC2086 # SYNTH_PACKAGES is a list of arguments
          python -m pip install --disable-pip-version-check $SYNTH_PACKAGES
          manifest=testdata/synthetic-library/library.manifest.json
          digest() { python -c 'import json,sys; print(json.load(open(sys.argv[1]))["library_digest"])' "$manifest"; }
          before="$(digest)"
          python testdata/synthetic-library/gen_fixture_library.py
          after="$(digest)"
          # The generator rewrites the manifest (at least its timestamp);
          # keep the committed one so the tests compare against it.
          git checkout -- "$manifest"
          if [ "$before" != "$after" ]; then
            echo "::warning::synthetic library differs from the committed manifest on ${{ runner.os }} ($before -> $after); tests that hash audio may fail"
            python testdata/synthetic-library/verify_library.py || true
          fi

      - name: Download the synthetic test library generated on Linux
        if: inputs.library-from-linux
        uses: actions/download-artifact@v8
        with:
          name: synthetic-library-${{ inputs.os }}
          path: ${{ runner.temp }}/synthetic-library
      - name: Unpack and check the synthetic test library
        if: inputs.library-from-linux
        working-directory: rust
        run: |
          rm -rf testdata/synthetic-library/library
          # --force-local: a Windows path such as D:\a\_temp is not a remote host.
          tar --force-local -C testdata/synthetic-library -xf "$RUNNER_TEMP/synthetic-library/synthetic-library.tar"
          python testdata/synthetic-library/verify_library.py

      - name: Format
        id: fmt
        working-directory: rust
        run: cargo fmt --all --check

      - name: Clippy
        id: clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The generated tool catalog under docs/ must be the one the code makes.
      - name: Agent tool catalog
        id: catalog
        working-directory: rust
        run: cargo run -p musaic-cli --locked -- catalog --check

      # --no-fail-fast: run every test binary and report every failure, not
      # just the first failing binary's.
      - name: Test
        id: test
        working-directory: rust
        run: cargo test --workspace --locked --no-fail-fast

      # A real HFS+ volume, which stores names decomposed (NFD): a disk
      # image the test creates, mounts under a temp dir without root, and
      # detaches. `#[ignore]`d in the workspace run, so it runs only here.
      - name: Test renames and scans on an HFS+ volume
        id: hfs
        if: runner.os == 'macOS'
        working-directory: rust
        run: |
          cargo test -p musaic-fsops --locked --test listed_spelling -- --ignored --nocapture
          cargo test -p musaic-api --locked --test scan_adopt -- --ignored --nocapture
          cargo test -p musaic-api --locked --test multi_disc_convert_http -- --ignored --nocapture
          cargo test -p musaic-api --locked --test multi_disc_gather_http -- --ignored --nocapture

      - name: Result
        id: result
        if: always()
        env:
          STATUS: ${{ job.status }}
          ALLOWED: ${{ inputs.allowed-to-fail }}
        run: |
          if [ "$STATUS" = "success" ]; then outcome=success; else outcome=failure; fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          if [ "$outcome" != "success" ] && [ "$ALLOWED" = "true" ]; then
            msg="Rust checks FAILED on ${{ inputs.os }}. This platform is not required, so the run can still pass; it is not a pass for ${{ inputs.os }}."
            echo "::warning::$msg"
            printf '### %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

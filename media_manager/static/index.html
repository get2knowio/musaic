<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Manager</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">♪</span>
      <span class="brand-name">Media Manager</span>
    </div>
    <div class="topbar-actions">
      <input
        id="search"
        type="search"
        placeholder="Filter by artist, album, year…"
        autocomplete="off"
      />
      <div class="view-toggle" role="tablist" aria-label="View mode">
        <button id="view-tiles" class="view-btn" role="tab" aria-selected="true" title="Tile view">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
          </svg>
        </button>
        <button id="view-list" class="view-btn" role="tab" aria-selected="false" title="List view">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="3" y="5"  width="18" height="2" rx="1" />
            <rect x="3" y="11" width="18" height="2" rx="1" />
            <rect x="3" y="17" width="18" height="2" rx="1" />
          </svg>
        </button>
      </div>
      <button id="rescan-btn" class="icon-btn" title="Rescan library" aria-label="Rescan library">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
          <path d="M12 5V2L7 7l5 5V8a6 6 0 1 1-6 6h-2a8 8 0 1 0 8-9z"/>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.94 2.5-1.7-.3a7.5 7.5 0 0 0-.6-1.45l1-1.4-1.5-1.5-1.4 1a7.5 7.5 0 0 0-1.45-.6l-.3-1.7h-2.1l-.3 1.7a7.5 7.5 0 0 0-1.45.6l-1.4-1-1.5 1.5 1 1.4a7.5 7.5 0 0 0-.6 1.45l-1.7.3v2.1l1.7.3a7.5 7.5 0 0 0 .6 1.45l-1 1.4 1.5 1.5 1.4-1a7.5 7.5 0 0 0 1.45.6l.3 1.7h2.1l.3-1.7a7.5 7.5 0 0 0 1.45-.6l1.4 1 1.5-1.5-1-1.4a7.5 7.5 0 0 0 .6-1.45l1.7-.3v-2.1Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="status-bar" class="status-bar"></div>
    <div id="scan-progress" class="scan-progress hidden">
      <div class="progress-text"><span id="progress-text">Scanning…</span><span id="progress-counter"></span></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    </div>
    <div id="albums" class="albums tiles"></div>
    <div id="empty-state" class="empty-state hidden">
      <h2>No library configured yet</h2>
      <p>Click the gear icon in the top-right to point Media Manager at a folder containing your album directories.</p>
    </div>
  </main>

  <!-- Album detail side panel -->
  <div id="detail-overlay" class="detail-overlay hidden" data-close-detail></div>
  <aside id="detail" class="detail" aria-hidden="true">
    <div class="detail-head">
      <h2 id="detail-heading">Album</h2>
      <button class="detail-close" data-close-detail aria-label="Close">&#x2715;</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
    <div class="detail-actions">
      <button id="suggest-metadata-btn" class="btn btn-primary">
        <span class="btn-label">Suggest metadata fixes</span>
      </button>
      <button id="suggest-cover-btn" class="btn">
        <span class="btn-label">Suggest cover art</span>
      </button>
      <button id="apply-btn" class="btn btn-success hidden">Apply changes</button>
      <button id="discard-btn" class="btn btn-ghost hidden">Discard</button>
    </div>
  </aside>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <label for="library-dir-input">Library directory</label>
      <input
        id="library-dir-input"
        type="text"
        placeholder="/Users/you/Music"
        spellcheck="false"
      />
      <p class="hint">Absolute path to the folder containing your album directories. Subfolders with FLAC files are treated as albums.</p>
      <div id="settings-error" class="error hidden"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close>Cancel</button>
        <button id="save-settings" class="btn btn-primary">Save &amp; Scan</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>

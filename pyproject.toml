[project]
name = "musaic"
version = "0.1.0"
description = "Web UI for browsing and managing a local music collection"
# airframe (the agent runtime) requires Python 3.12+, so musaic does too.
requires-python = ">=3.12"
dependencies = [
    # Cap below 0.137: fastapi 0.137.x regressed include_router (routes
    # silently dropped on include), which breaks every /api route. 0.136.1
    # is the last working line. Revisit when upstream fixes it.
    "fastapi>=0.136.1,<0.137",
    "uvicorn[standard]>=0.49.0",
    "mutagen>=1.48.1",
    "pydantic>=2.13.4",
    # Vendor-neutral agent runtime. The [claude] / [copilot] / [opencode]
    # extras pull the respective adapter SDKs so the AI worker can target those
    # providers via settings.ai_provider_id (Copilot + OpenCode serve native
    # web tools). Install more adapters (e.g. airframe-agents[bedrock]) as
    # needed. Pinned to 0.9.1; bump as airframe releases.
    # NB: [kimi] is excluded — disabled upstream pending an mcp co-install fix.
    "airframe-agents[claude,copilot,opencode]==0.9.1",
    "anyio>=4.14.1",
    "Pillow",
    "requests",
    # Per-track audio fingerprinting via Chromaprint + AcoustID. Wraps the
    # external `fpcalc` binary (install with `brew install chromaprint` or
    # equivalent) and AcoustID's HTTP API. Only used by the track-gaps fix
    # cascade and the future duplicate-detection / MBID-anchoring checks;
    # the rest of the app works fine without it (we surface a clear
    # "fpcalc not found" finding when it's missing).
    "pyacoustid>=1.3",
    # Audio analysis: per-track BPM (librosa beat-tracking) and ReplayGain
    # tagging (pyloudnorm; EBU R128 / BS.1770). Both are optional at
    # runtime — the analyze endpoints surface a clear "not installed"
    # error instead of crashing when missing.
    "librosa>=0.10",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musaic"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.9",
]

[project.scripts]
musaic = "musaic.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lean starter ruleset — high-signal correctness (pyflakes) + import hygiene +
# whitespace. E501 (line length) is intentionally off: the AI system prompts and
# some docstrings are long single strings not worth wrapping. Tighten over time
# (add UP/B/SIM) once the baseline is green in CI.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
# E501 long AI-prompt strings/docstrings; E731/E741 deliberate local lambdas +
# short math var names (l = LUFS in the loudness aggregation).
ignore = ["E501", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# E402: imports intentionally placed after top-of-file setup, not a mistake.
"tests/conftest.py" = ["E402"]      # sets MUSAIC_CONFIG_DIR before importing musaic.*
"scripts/*" = ["E402"]              # sys.path / env setup precedes imports
"musaic/fingerprint.py" = ["E402"]  # ctypes imports grouped with the dylib-loading block
"musaic/mb_lookup.py" = ["E402"]    # lru_cache import grouped with its cached helper

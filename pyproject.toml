[project]
name = "musaic"
version = "0.1.0"
description = "Web UI for browsing and managing a local music collection"
# airframe (the agent runtime) requires Python 3.11+, so musaic does too.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mutagen>=1.47",
    "pydantic>=2.0",
    # Vendor-neutral agent runtime. The [claude] extra pulls claude-agent-sdk;
    # install additional adapters (e.g. airframe-agents[bedrock]) to let the
    # AI worker target other providers via settings.ai_provider_id. Sourced
    # from the local checkout while the two projects co-evolve (see
    # [tool.uv.sources]); pin to the PyPI release once it stabilises.
    "airframe-agents[claude]",
    "anyio>=4.0",
    "Pillow",
    "requests",
    # Per-track audio fingerprinting via Chromaprint + AcoustID. Wraps the
    # external `fpcalc` binary (install with `brew install chromaprint` or
    # equivalent) and AcoustID's HTTP API. Only used by the track-gaps fix
    # cascade and the future duplicate-detection / MBID-anchoring checks;
    # the rest of the app works fine without it (we surface a clear
    # "fpcalc not found" finding when it's missing).
    "pyacoustid>=1.3",
    # Audio analysis: per-track BPM (librosa beat-tracking) and ReplayGain
    # tagging (pyloudnorm; EBU R128 / BS.1770). Both are optional at
    # runtime — the analyze endpoints surface a clear "not installed"
    # error instead of crashing when missing.
    "librosa>=0.10",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12",
]

[tool.uv.sources]
# Local editable checkout while airframe + musaic co-evolve. Swap for a
# pinned PyPI version (drop this block) once airframe stabilises.
airframe-agents = { path = "../airframe", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musaic"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[project.scripts]
musaic = "musaic.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

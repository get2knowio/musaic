[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.0-rc.1"
publish = false
rust-version = "1.99"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde_json = "1"
sha1 = "0.11"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

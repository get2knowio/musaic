[package]
name = "musaic-app"
description = "The application object: builder, startup and shutdown, the AI worker host, service environments (no HTTP; musaic-api and later faces wrap it)"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
musaic-ai = { path = "../musaic-ai" }
musaic-checks = { path = "../musaic-checks" }
musaic-commands = { path = "../musaic-commands" }
musaic-core = { path = "../musaic-core" }
musaic-db = { path = "../musaic-db" }
musaic-fsops = { path = "../musaic-fsops" }
musaic-tags = { path = "../musaic-tags" }
musaic-events = { path = "../musaic-events" }
musaic-log = { path = "../musaic-log" }
musaic-net = { path = "../musaic-net" }
musaic-resolve = { path = "../musaic-resolve" }
musaic-scan = { path = "../musaic-scan" }
musaic-secrets = { path = "../musaic-secrets" }
musaic-services = { path = "../musaic-services" }
rusqlite.workspace = true
same-file = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
semver = "1"
# Deflate only, through the `flate2` already in the tree: the Claude Desktop bundle
# and the skill archive are small deflated zips written with fixed timestamps.
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2"] }
tempfile.workspace = true
# Only `src/ops/record.rs` names it (the settings document keeps its stored key order).
serde_json.workspace = true
thiserror.workspace = true
# The watch channels the streams subscribe to (pool, checks, jobs,
# shutdown); no runtime.
tokio = { version = "1", features = ["sync", "macros"] }

# macOS only, and already in the tree through `zip`: `statvfs` tells a
# read-only disk image from a writable external drive under `/Volumes/`
# without `unsafe`.
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.32.0", default-features = false, features = ["fs"] }

[dev-dependencies]
musaic-testdata = { path = "../musaic-testdata" }
jsonschema = { version = "0.61", default-features = false }

[lints]
workspace = true

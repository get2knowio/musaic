[package]
name = "musaic-commands"
description = "The agent tool contract: typed tools, permission kinds, error codes, the pairing proofs and the descriptor, shared by the app and the bundled CLI"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Only the album-id derivation (the config-dir id uses it); no database.
musaic-core = { path = "../musaic-core" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_path_to_error = "0.1"
time = { version = "0.3", default-features = false, features = ["parsing"] }
schemars = "1"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
thiserror.workspace = true

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
tempfile.workspace = true

[lints]
workspace = true

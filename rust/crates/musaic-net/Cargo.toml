[package]
name = "musaic-net"
description = "Outbound HTTP: request shapes, pacing, retry, and replay from recorded fixtures"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
musaic-log = { path = "../musaic-log" }
base64 = "0.22"
musaic-core = { path = "../musaic-core" }
musaic-resolve = { path = "../musaic-resolve" }
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
# Live HTTPS transport (blocking; rustls + ring + webpki-roots, gzip). See src/live.rs.
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
# Already in the tree through ureq; named only to recognise its errors.
rustls = { version = "0.23", default-features = false }

[dev-dependencies]
musaic-testdata = { path = "../musaic-testdata" }
# Only to make the local test server send a TCP reset (SO_LINGER 0).
socket2 = "0.6"
musaic-scan = { path = "../musaic-scan" }

[lints]
workspace = true

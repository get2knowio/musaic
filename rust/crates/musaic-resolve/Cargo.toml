[package]
name = "musaic-resolve"
description = "The metadata resolver: find_release, the tiered cascade, Tier 1 alignment, AlbumResolution"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
musaic-log = { path = "../musaic-log" }
musaic-core = { path = "../musaic-core" }
musaic-db = { path = "../musaic-db" }
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1.workspace = true
thiserror.workspace = true
regex = "1"
unicode-normalization = "0.1"

[dev-dependencies]
musaic-testdata = { path = "../musaic-testdata" }
base64 = "0.22"
musaic-net = { path = "../musaic-net" }
tempfile.workspace = true
form_urlencoded = "1"

[lints]
workspace = true

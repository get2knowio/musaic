[package]
name = "musaic-services"
description = "Album apply pipeline and background library scan service (synchronous; the HTTP host drives them)"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
musaic-bpm = { path = "../musaic-bpm" }
musaic-checks = { path = "../musaic-checks" }
musaic-core = { path = "../musaic-core" }
musaic-db = { path = "../musaic-db" }
musaic-dsp = { path = "../musaic-dsp" }
musaic-events = { path = "../musaic-events" }
musaic-fsops = { path = "../musaic-fsops" }
musaic-log = { path = "../musaic-log" }
musaic-net = { path = "../musaic-net" }
musaic-resolve = { path = "../musaic-resolve" }
musaic-scan = { path = "../musaic-scan" }
musaic-secrets = { path = "../musaic-secrets" }
musaic-tags = { path = "../musaic-tags" }
rusqlite.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Cover thumbnails (thumbs.py): same version and features musaic-tags
# already builds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
jpeg-encoder = "0.7"

[dev-dependencies]
musaic-testdata = { path = "../musaic-testdata" }
base64 = "0.23"
sha2 = "0.11"
tempfile.workspace = true
unicode-normalization = "0.1"

[lints]
workspace = true

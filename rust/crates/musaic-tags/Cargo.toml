[package]
name = "musaic-tags"
description = "FLAC mutation primitives: Vorbis comment writes, cover embed, cover.jpg sidecar"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
musaic-log = { path = "../musaic-log" }
musaic-core = { path = "../musaic-core" }
musaic-scan = { path = "../musaic-scan" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
jpeg-encoder = "0.7"
same-file = "1"

[dev-dependencies]
musaic-testdata = { path = "../musaic-testdata" }
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true
